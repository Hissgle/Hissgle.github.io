# ===========================================================================
# 自动构建并部署博客到 GitHub Pages
#
# 触发：push 到 main，或在 Actions 页面手动触发
# 产物：构建出的静态站点推到 gh-pages 分支（源码仍留在 main）
#
# ⚠️ 必须先把 Pages 的发布源切到 GitHub Actions，
#    否则 GitHub 会继续用内置的 Jekyll 构建器处理本仓库，报：
#      github-pages 232 | Error: The butterfly theme could not be found.
#    因为 Jekyll 读到了 Hexo 的 _config.yml（theme: butterfly），
#    但仓库里没有 Jekyll 的 _layouts/，也认不出 butterfly 这个主题。
#
#    操作：仓库 → Settings → Pages → Build and deployment → Source
#          从「Deploy from a branch」改为「GitHub Actions」
#
# ⚠️ 启用后不要再用本机 `hexo deploy`：
#     _config.yml 的 deploy.branch 已是 gh-pages，与本 workflow 目标一致，
#     但两者同时用会互相覆盖，建议统一由本 workflow 部署。
# ===========================================================================

name: Deploy Hexo Blog

on:
  push:
    branches:
      - main
  # 允许在 Actions 页面点按钮手动跑一次
  workflow_dispatch:

# 同一时间只跑一个部署；新 push 到来时排队等待，不中断正在进行的部署
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写 gh-pages 分支
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要把产物推到 gh-pages，保留完整历史避免推送被拒
          fetch-depth: 0

      # ⚠️ 顺序很关键：必须先 setup-node 再 setup-pnpm。
      # 之前写成 pnpm 在前，导致 pnpm 在 runner 自带的旧 Node 下运行，报：
      #   warn: The current version of Node.js is v20.20.2
      #   Error [ERR_UNKNOWN_BUILTIN_MODULE]: No such built-in module: node:sqlite
      # （pnpm 11 依赖 node:sqlite，而该内置模块在 Node 20 上不存在）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与本机一致（本机 Node 24.11.1 + pnpm 11.7.0，已验证可构建）。
          # 下限要求：Hexo 8 >= 20.19.0；pnpm 11 >= 22.13。
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本机 pnpm 11.7.0 一致，避免 lockfile（v9 格式）解析差异。
          # 注意：此步会安装 pnpm，但运行时使用的是上面 setup-node 提供的 Node。
          version: 11

      # 版本守卫：版本不对就直接失败并给出明确原因，
      # 而不是等到后面报 ERR_UNKNOWN_BUILTIN_MODULE 这种难懂的错误
      - name: Verify tool versions
        run: |
          echo "node: $(node -v)"
          echo "pnpm: $(pnpm -v)"
          NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "::error::Node $NODE_MAJOR 太旧。pnpm 11 需要 >= 22.13（依赖 node:sqlite 内置模块）。"
            echo "::error::请确认 setup-node 步骤排在 pnpm/action-setup 之前。"
            exit 1
          fi
          echo "版本检查通过"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 说明：主题目录 themes/butterfly 是本地签出的，其 scripts/helpers/page.js
      # 需要 moment-timezone 与 hexo-util。主题自己的 node_modules 被主题
      # .gitignore 排除，CI 上不存在；依赖改由根 package.json 提供，
      # Node 会从 themes/butterfly/ 逐级向上找到根 node_modules。
      # 若此处报 Cannot find module 'moment-timezone'，说明根 package.json
      # 里那条依赖被删掉了。

      - name: Build
        run: pnpm run site

      - name: Show build result
        run: |
          echo "生成文件数：$(find public -type f | wc -l)"
          ls -la public | head -20

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # 保留 gh-pages 历史，便于回滚；不强制单提交孤儿分支
          force_orphan: false
          # 若以后绑自定义域名，把 CNAME 文件放到 source/ 下即可
