# 自动构建并部署到 GitHub Pages。
#
# 仓库 Settings → Pages → Source 必须设为「GitHub Actions」，
# 否则 GitHub 会用内置的 Jekyll 处理本仓库，报 "The butterfly theme could not be found"。
# 启用后不要再在本机跑 hexo deploy，两者会互相覆盖。

name: Deploy Hexo Blog

on:
  push:
    branches:
      - main
  workflow_dispatch: # 也可在 Actions 页面手动触发

concurrency:
  group: pages-deploy
  cancel-in-progress: false # 新 push 排队等待，不中断正在进行的部署

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写 gh-pages 分支
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 推 gh-pages 需要完整历史

      # 顺序不能反：pnpm 11 依赖 node:sqlite，而 Node 20 没有这个内置模块。
      # pnpm 排在前面会在 runner 自带的旧 Node 下运行，报 ERR_UNKNOWN_BUILTIN_MODULE。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # 版本不满足就直接失败并说明原因，别等到后面报难懂的错误
      - name: Verify tool versions
        run: |
          echo "node: $(node -v)"
          echo "pnpm: $(pnpm -v)"
          NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "::error::Node $NODE_MAJOR 太旧。pnpm 11 需要 >= 22.13。"
            exit 1
          fi
          echo "版本检查通过"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 主题的 scripts/helpers/page.js 需要 moment-timezone 与 hexo-util，
      # 由根 package.json 提供，Node 会从 themes/butterfly/ 逐级向上找到。
      - name: Build
        run: pnpm run site

      - name: Show build result
        run: |
          echo "生成文件数：$(find public -type f | wc -l)"
          ls -la public | head -20

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: false # 保留历史便于回滚
