# Butterfly 主题配置：覆盖 themes/butterfly/_config.yml 的同名项，只写要改的部分。

# 站点访问统计（不蒜子），数据源 https://busuanzi.ibruce.info
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 值只写纯色（如 "#ff7e5f"）会被当成 background-color 处理。
cover:
  default_cover:
    - 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)'
    - 'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)'
    - 'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)'
    - 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)'
    - 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)'
    - 'linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)'

# 页面背景：淡渐变，让卡片浮在上面有层次
background: 'linear-gradient(180deg, #eef3fb 0%, #f7f9fc 40%, #f2f6fa 100%)'

# 首屏副标题。effect: true = 打字机（逐字打出，带闪烁光标）；false = 静态文本直接显示。
# 依据：themes/butterfly/layout/includes/third-party/subtitle.pug 的分支是 if (!{effect}) → 走 Typed，
# 上游官方 _config.yml 注释也是 Typewriter Effect: true。注意本条语义曾在这里被写反过。
# source: 1 表示调一言 API（v1.hitokoto.cn，不是百度的文心一言），
# 取不到时自动退回下面的 sub 文案，兜底文案同样走打字机。
#
# 打字机循环已由 /js/subtitle-loop.js 接管（下方 inject 里注入）：主题只负责按 source
# 取一次内容，之后「打完一轮 → 自动再取一条新的 → 回删后接着打」由这个脚本驱动。
# 因此上游的 typed_option（typeSpeed / backSpeed / backDelay / loop）不再生效，
# 速度、停留时长等参数改 /js/subtitle-loop.js 顶部的 CFG；光标样式见 /css/subtitle-loop.css。
subtitle:
  enable: true
  effect: true
  source: 1
  sub:
    - 我已随暖春一同离去，但你会熟悉这片天空

related_post:
  enable: false

# ===== 全站字体（Claude 风格混排）=====
# 取自 Claude 的排版体系：界面无衬线 + 正文/标题衬线 + 代码等宽。
# Claude 用的是 Anthropic 定制私有字体，不能合法自托管，这里换成免费的观感替身：
#   Space Grotesk   ≈ Styrene / Anthropic Sans（界面）
#   Source Serif 4  ≈ Galaxie Copernicus / Anthropic Serif（正文、标题）
#   JetBrains Mono  ≈ Anthropic Mono（代码）
# 字体栈变量（--font-*）定义在 source/css/fonts.css，这里只引用变量，
# 换字体改那一个文件即可；中文字形这些字体没有，回退系统字体（苹方/雅黑），
# 与 Claude 中文环境下的表现一致。细节见 docs/fonts.md。
font:
  font_family: 'var(--font-sans)'
  code_font_family: 'var(--font-mono)'

# 站名/副标题/侧栏作者信息（#site-title、#site-subtitle、.site-name、作者卡）
# 走衬线，对应 Claude 衬线 logotype 的观感；font_link 留空 = 不额外加载远程字体。
blog_title_font:
  font_link:
  font_family: 'var(--font-serif)'

# 侧边栏卡片
aside:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2026/9/17 12:00 
  card_newest_comments:
    enable: true
    limit: 6
    avatar: true
    storage: 10 # 缓存分钟数，避免每次刷新都请求后端
  
  card_tags:
    enable: true
    limit: 40 # 0 = 显示全部
    color: true
    # 只支持颜色值字符串，不支持按标签名指定的写法
    custom_colors:
      - "#FF6B6B"
      - "#4ECDC4"
    orderby: name # 顺序固定
    order: 1

# 鼠标点击水波纹涟漪（source/js/click-ripple.js + source/css/click-ripple.css），
# 取代主题自带的 click_heart 爱心特效；只对桌面端开启。
click_heart:
  enable: false
  mobile: false

# 樱花飘落脚本在 source/js/sakura.js，通过下面的 inject.bottom 注入所有页面。
# 调参改那行的 data-* 即可：mobile / density / trail / push / pushradius / color / zindex。
# 内联脚本里的 { } 在 YAML 里会有解析歧义。
# 控制台可用 window.sakura.pushedCount() / window.sakura.destroy() 调试。
inject:
  head:
    # 全站字体：@font-face、字体栈变量与衬线的应用规则都在 /css/fonts.css。
    # 变量是字体栈的唯一出处，主题配置 font.font_family 等引用它们。
    # 注意顺序：主题默认 inject.head 里也有一条同内容的 custom.css（themes/butterfly/_config.yml），
    # deepMerge 对数组是「主题项在前、用户项追加、完全相同去重」，所以 custom.css 实际
    # 先于这里的所有文件加载。想用 custom.css 覆盖字体规则，得靠更高优先级的选择器。
    # preload 只挑首屏必用的两个文件：衬线（站名/卡片标题/正文）和界面无衬线；
    # 等宽、斜体文件由 @font-face 按需求加载，不占首屏。
    - <link rel="preload" href="/fonts/source-serif-4-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
    - <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    - <link rel="stylesheet" href="/css/fonts.css">
    - <link rel="stylesheet" href="/css/custom.css">
    - <link rel="stylesheet" href="/css/glass-mask.css">
    # 下面几个样式原先内联在本文件里，现已拆成独立文件：
    # 独立文件能被浏览器缓存，也能参与 hexo-minify 的 CSS 压缩。
    # 注意顺序：custom.css 在前，其它文件里的规则大多是对主题的定向覆盖，不依赖 custom.css。
    - <link rel="stylesheet" href="/css/reading-progress.css">
    - <link rel="stylesheet" href="/css/vinyl.css">
    - <link rel="stylesheet" href="/css/reveal.css">
    - <link rel="stylesheet" href="/css/card-tilt.css">
    # 首页点卡片「封面放大铺满屏幕」过渡层（脚本在下方 bottom 里）
    - <link rel="stylesheet" href="/css/cover-zoom.css">
    # 鼠标点击水波纹涟漪（脚本在下方 bottom 里）
    - <link rel="stylesheet" href="/css/click-ripple.css">
    # 右下角「写文章」入口（Twitter 风格圆形加号，样式在 write-fab.css）
    - <link rel="stylesheet" href="/css/write-fab.css">
    # 侧边栏「公告」前的红色晃动喇叭 → 白色呼吸圆点（样式在 notice-dot.css）
    - <link rel="stylesheet" href="/css/notice-dot.css">
    # 首屏站名的小幅度湍流漂移（逻辑在下方 bottom 的 /js/title-drift.js）
    - <link rel="stylesheet" href="/css/title-drift.css">
    # 首屏副标题打字机的光标（逻辑在下方 bottom 的 /js/subtitle-loop.js）
    - <link rel="stylesheet" href="/css/subtitle-loop.css">
    # 主题 subtitle.pug 的 pjaxSendOnce 销毁回调里写的是裸标识符 `typed`（上游笔误，
    # 应为 window.typed）。首屏打字机还没初始化就点卡片跳走时该标识符不存在，会抛
    # ReferenceError。这里预先把全局变量定义成 null 让回调安全短路；不改 themes/ 下的
    # 文件，主题升级不会丢，打字机实例初始化后照常被销毁。
    - <script>window.typed = null;</script>
    # FastAPI 后端已隔离停用，恢复见 api/enable-fastapi.ps1
    # - <script>window.BLOG_API_BASE='https://space-differential-currencies-tucson.trycloudflare.com';</script>
    # - <style>.post-api-stats{display:flex;gap:16px;align-items:center;margin:12px 0;font-size:14px;color:#888}.post-api-stats b{color:#ff5733}.pas-like{cursor:pointer;border:1px solid #ddd;background:transparent;border-radius:14px;padding:3px 12px;font-size:13px;color:inherit}.pas-like:disabled{opacity:.6}</style>
  bottom:
    # 声明式内容放在样式/脚本之前，保证脚本执行时 DOM 已经存在。
    # 网易云黑胶唱片播放器（左下角固定）。界面全部用 CSS 自绘，不用任何图片。
    # 交互：点一下暂停（停在当前角度不回到起点），再次点击继续转动。
    #
    # data-vinyl 是配置（JSON）：type 为 song 时 id 填歌曲 ID，为 playlist 时填歌单 ID，
    # 填错类型接口返回 500。loop 可选 one / all / none。
    # 换歌：从 https://music.163.com/#/song?id=XXXX 取那串数字填到 id。
    # 样式见 /css/vinyl.css，逻辑见 /js/vinyl.js。
    - '<div id="vinyl-player" data-vinyl=''{"type":"song","id":"1303464858","server":"netease","api":"https://api.i-meto.com/meting/api?server=:server&type=:type&id=:id&r=:r","loop":"one","size":132,"spin":20,"label":"#f3c6d4"}''></div>'
    - '<canvas id="universe"></canvas>'

    # 以下脚本原先内联在本文件里，现已全部拆成独立文件。
    # 好处：可被浏览器缓存、可参与 hexo-minify 的 JS 压缩、有语法高亮、可单独 lint。
    #
    # 顺序有依赖：reading-progress.js 需要 body 里已有 #reading-progress（由它自己兜底创建），
    # universe.js / sakura.js 需要上面的 <canvas>。
    - <script src="/js/reading-progress.js"></script>
    - <script src="/js/nav-title.js"></script>
    - <script src="/js/universe.js"></script>
    - <script id="sakura-js" src="/js/sakura.js" data-mobile="false" data-density="0.00007" data-trail="true" data-push="9" data-pushradius="110" data-zindex="1" data-color="#ffc0d0"></script>
    - <script src="/js/vinyl.js"></script>

    # FastAPI 后端已隔离停用，恢复见 API-README.md
    # - '<script src="/js/api-stats.js"></script>'

    # 右下角「写文章」入口。地址是 Vercel 项目实际域名；换项目/域名时同步修改。
    # 留空或删掉这一行则完全不显示入口。
    - '<script id="write-fab-script" src="/js/write-fab.js" data-admin-url="https://hissgle-github-io-9goh.vercel.app" defer></script>'

    # 滚动渐显：卡片进入视口时从下方 34px 淡入上移。样式见 /css/reveal.css。
    - <script src="/js/reveal.js"></script>

    # 首页博文卡片悬停：浮起 + 朝鼠标位置倾斜（弹簧模拟，封面图不再放大）。
    # 样式见 /css/card-tilt.css，可调参数在脚本顶部（MAX_TILT / STIFF / DAMP）。
    - <script src="/js/card-tilt.js"></script>

    # 点卡片进文章：封面平滑放大铺满屏幕，Pjax 换页后「落」进文章页 banner。
    # 仅首页卡片触发；参数在脚本顶部 CFG。样式见 /css/cover-zoom.css。
    - <script src="/js/cover-zoom.js"></script>

    - <script src="/js/header-fade.js"></script>
    - <script src="/js/gallery-fade.js"></script>
    - <script src="/js/search-ui.js"></script>

    # 首屏副标题打字机：打完一轮自动再取一条一言接着打（接管主题的 processSubtitle）。
    # 必须在主题的 subtitle 脚本之后执行，所以放在 bottom。参数在脚本顶部 CFG。
    - <script src="/js/subtitle-loop.js"></script>

    # 首屏站名按字符连续随机漂移；幅度在脚本顶部 CFG，尊重系统减少动态效果设置。
    - <script src="/js/title-drift.js"></script>

    # 鼠标点击处的透明水波纹涟漪，取代主题自带的爱心特效。样式见 /css/click-ripple.css。
    - <script src="/js/click-ripple.js"></script>

# 顶部导航。语法：显示名: /路径/，也可以写成 显示名: /路径/ || 图标class（图标见 fontawesome.com）
# 这里的图标 class 不是拿来显示 Font Awesome 的 —— custom.css 的「顶栏图标」段会把 FA 字形
# 顶掉，再把 <i> 当线条图标的容器用。之所以还留着：一是 menu_item.pug 靠 `if icon` 判断
# 要不要渲染 <i>，二是写出来能一眼看出每项是什么语义。
# 「相册」其实定义在 themes/butterfly/_config.yml 里。主题配置和本文件是深合并（不是替换），
# 只写下面三项的话它会带着 fas fa-images 混进来。这里把同名键重写一遍盖掉它，
# 就不必去动 themes/ 下的文件（那边改了主题升级会丢）。
menu:
  相册: /gallery/ || fas fa-images
  关于: /about/ || fas fa-user
  友链: /link/ || fas fa-link
  归档: /archives/ || fas fa-archive

# 标签页图标。原来指向不存在的 /img/favicon.png，现在用主题自带的。
favicon: /img/favicon.ico

# 导航栏左上角。默认显示文字站点标题，填 logo 可换成图片。
nav:
  logo:
  display_title: true
  fixed: true # 滚动时吸顶

# 加载动画：用 pace 顶部细进度条，比全屏遮罩轻
preloader:
  enable: true
  source: 2

# 第三方静态资源地址。本机访问不了 cdn.jsdelivr.net，统一改走 npmmirror。
# third_party_provider 只影响 preconnect 的域名：CDN.option 在 cdn.js 里是最后合并的，
# 会覆盖地址生成，真实资源地址都由下面 option 写死。默认值 jsdelivr 会让页面去

CDN:
  third_party_provider: custom
  custom_format: https://registry.npmmirror.com/${name}/${version}/files/${min_file}
  option:
    busuanzi: https://events.vercount.one/js
    pjax: https://registry.npmmirror.com/pjax/0.2.8/files/pjax.min.js
    fontawesome: https://registry.npmmirror.com/@fortawesome/fontawesome-free/7.3.1/files/css/all.min.css
    lazyload: https://registry.npmmirror.com/vanilla-lazyload/19.1.3/files/dist/lazyload.iife.min.js
    click_heart: https://registry.npmmirror.com/butterfly-extsrc/1.1.6/files/dist/click-heart.min.js
    pace_js: https://registry.npmmirror.com/pace-js/1.2.4/files/pace.min.js
    pace_default_css: https://registry.npmmirror.com/pace-js/1.2.4/files/themes/blue/pace-theme-minimal.css
    instantpage: https://registry.npmmirror.com/instant.page/5.2.0/files/instantpage.js
    egjs_infinitegrid: https://registry.npmmirror.com/@egjs/infinitegrid/4.13.0/files/dist/infinitegrid.min.js
    typed: https://registry.npmmirror.com/typed.js/3.0.0/files/dist/typed.umd.js
    sharejs: https://registry.npmmirror.com/butterfly-extsrc/1.1.6/files/sharejs/dist/js/social-share.min.js
    sharejs_css: https://registry.npmmirror.com/butterfly-extsrc/1.1.6/files/sharejs/dist/css/share.min.css
    waline_js: https://registry.npmmirror.com/@waline/client/3.15.2/files/dist/waline.js
    waline_css: https://registry.npmmirror.com/@waline/client/3.15.2/files/dist/waline.css

# Pjax 页面切换：只替换 #body-wrap 里的内容，播放器在它之外所以音乐不断
pjax:
  enable: true
  exclude:

# 评论系统：Waline
comments:
  use: Waline
  text: true
  lazyload: false
  count: false
  card_post_count: true

# Waline 后端地址，文档 https://waline.js.org
waline:
  serverURL: https://myblog-sandy-theta.vercel.app
  bg:
  pageview: false # 已用不蒜子统计，避免出现两套数字

reading_progress: 
  enable: true 
  color: "#ff5733"
  height: 3px

# 首次进入页面时的配色：light / dark。
# 只在「没手动切过主题」时生效 —— 右下角按钮的切换结果存在 localStorage 里，优先于这里。
# darkmode.enable 已是 true，两套 CSS 变量一直都会编译，改这里不用重新编译 CSS。
display_mode: dark


live2d:
  enable: false
  mobile:
    show: false
